<script>
/*
  PROJECTS field guide (one object per WhatsApp group):
    name         short display name (emoji flags fine to keep)
    aliases      alternate names/spellings the search box should also match
    purpose      one dense sentence: what's being negotiated/done, current state
    priority     "high" / "medium" / "low"
    caution      true/false — flag if the chat shows advance-fee / unverifiable-
                 counterparty patterns worth a second look before committing
                 time, money, or a signature
    whatsappLink the group's invite link (verified live before adding), or null
    notes        reviewer/annotation entries — [{author, date, text}], usually empty
    tasks        [task, owner, status, notes] rows; status is exactly
                 "done" / "progress" / "notstarted"
*/
const PROJECTS = [
  {
    name: "🇿🇦Serenity🇿🇦",
    aliases: ["Serenity"],
    purpose: "Distribution deal for VivaChek drug/screening test kits into South Africa — sourcing via Frank, local commercialization via Nicole (trading as MedSerenity). Critical path is SAHPRA product licensing; a Cape Town office visit was arranged 9/9 after slow email/phone response from the compliance vendor.",
    priority: "high",
    caution: false,
    whatsappLink: "https://chat.whatsapp.com/LJWJ0UhQQxU6jmBt1q7PXX?mode=gi_t",
    notes: [],
    tasks: [
      ["Research SADC certificate-of-origin route (one member state's certification recognized across SADC)", "Dr. Kudzai Nyamuomba", "done", "Raised 8/22; superseded once SAHPRA licensing was confirmed as the actual requirement (8/27)"],
      ["Confirm which regulatory path is required to distribute in SA", "Nicole Chitareni", "done", "Ministry contact confirmed 8/27: SADC certificate helps, but a SAHPRA certificate/license is still required"],
      ["Arrange courier of 5 test kits to Nicole", "Dr. Kudzai Nyamuomba / Frank", "progress", "Set for 8/26 via The Courier Guy (Louis Trichardt); postponed a week after Nicole was hospitalized with flu (8/25); no confirmed delivery yet in the chat"],
      ["Decide which company entity to register/trade under", "Nicole Chitareni / Dr. Kudzai Nyamuomba", "done", "8/27: use Nicole's existing tax-compliant, CSD-registered company (trading as \"MedSerenity\") rather than incur 2x+ cost registering a new pharma entity"],
      ["Get SAHPRA compliance quotes", "Nicole Chitareni", "done", "Two companies quoted 8/27; Pharmers' brochure: R55,000 total, R15,600 for the application stage alone, ~15 working days per their materials"],
      ["Get a full cost breakdown reflecting existing certifications (ISO 13485 / MDSAP already held)", "Nicole Chitareni", "progress", "Requested 8/27, followed up again 8/31 with no response by that date"],
      ["Follow up with Pharmers after slow response", "Nicole Chitareni", "done", "Follow-up email sent 8/31; vendor finally responded and a meeting was held 9/8 at 14:00 CAT"],
      ["Scope the engagement down to application only", "Dr. Kudzai Nyamuomba", "done", "9/8: team decided they only need the SAHPRA application itself — skipping the consultation and collection-fee add-ons"],
      ["Visit SAHPRA Radiation Control office in person for direct answers", "~ Norman Nyamuwomba", "progress", "Nicole asked 9/9 after phone/email to the department went unanswered; Norman confirmed 9/9 he'd visit the Tygervalley office and report back on process, documentation, and timelines"],
    ]
  }
];

function countBy(tasks) {
  const c = { done: 0, progress: 0, notstarted: 0 };
  tasks.forEach(t => c[t[2]]++);
  return c;
}

function overallCounts() {
  let total = 0, done = 0, progress = 0, notstarted = 0;
  PROJECTS.forEach(p => {
    const c = countBy(p.tasks);
    total += p.tasks.length; done += c.done; progress += c.progress; notstarted += c.notstarted;
  });
  return { total, done, progress, notstarted };
}

function renderStats() {
  const { total, done, progress, notstarted } = overallCounts();
  const stats = [
    { num: PROJECTS.length, lbl: "Groups", cls: "" },
    { num: total, lbl: "Total Tasks", cls: "" },
    { num: done, lbl: "Done", cls: "done" },
    { num: progress, lbl: "In Progress", cls: "progress" },
    { num: notstarted, lbl: "Not Started", cls: "notstarted" },
  ];
  document.getElementById("stats").innerHTML = stats.map(s =>
    `<div class="stat ${s.cls}"><div class="num">${s.num}</div><div class="lbl">${s.lbl}</div></div>`
  ).join("");
}

function renderDonut() {
  const { total, done, progress, notstarted } = overallCounts();
  const r = 30, circ = 2 * Math.PI * r;
  const dDone = total ? (done/total)*circ : 0;
  const dProg = total ? (progress/total)*circ : 0;
  const dNS = total ? (notstarted/total)*circ : 0;
  let offset = 0;
  const seg = (len, color, off) => `<circle r="${r}" cx="40" cy="40" fill="none" stroke="${color}" stroke-width="10"
      stroke-dasharray="${len} ${circ-len}" stroke-dashoffset="${-off}" transform="rotate(-90 40 40)"/>`;
  const svg = `
    <svg width="80" height="80" viewBox="0 0 80 80">
      <circle r="${r}" cx="40" cy="40" fill="none" stroke="#263640" stroke-width="10"/>
      ${seg(dDone, "#25D366", offset)}
      ${offset += dDone, seg(dProg, "#FFC000", offset)}
      ${offset += dProg, seg(dNS, "#E5484D", offset)}
      <text x="40" y="45" text-anchor="middle" font-family="ui-monospace, monospace" font-size="16" font-weight="700" fill="#E9EDEF">${total ? Math.round(done/total*100) : 0}%</text>
    </svg>`;
  const legend = `
    <div class="donut-legend">
      <div><span class="sw" style="background:#25D366"></span>Done — ${done}</div>
      <div><span class="sw" style="background:#FFC000"></span>In Progress — ${progress}</div>
      <div><span class="sw" style="background:#E5484D"></span>Not Started — ${notstarted}</div>
    </div>`;
  document.getElementById("donut-block").innerHTML = svg + legend;
}

let currentFilter = "all";
let searchTerm = "";

function onSearch(v) {
  searchTerm = v.trim().toLowerCase();
  renderGrid();
}

function cycleStatus(projIdx, taskIdx, ev) {
  ev.stopPropagation();
  const order = ["notstarted", "progress", "done"];
  const t = PROJECTS[projIdx].tasks[taskIdx];
  const next = order[(order.indexOf(t[2]) + 1) % order.length];
  t[2] = next;
  renderStats();
  renderDonut();
  renderGrid();
  const card = document.querySelector(`.card[data-idx="${projIdx}"]`);
  if (card) card.classList.add("open");
}

function renderFilters() {
  const opts = [["all","All Groups"],["high","High Priority"],["medium","Medium Priority"],["low","Low Priority"],["caution","⚠ Caution"]];
  document.getElementById("filters").innerHTML = opts.map(([key,label]) =>
    `<button class="filter-btn${key===currentFilter?' active':''}" data-key="${key}">${label}</button>`
  ).join("");
  document.querySelectorAll(".filter-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      currentFilter = btn.dataset.key;
      renderFilters();
      renderGrid();
    });
  });
}

function statusLabel(s) {
  return s === "done" ? "Done" : s === "progress" ? "In Progress" : "Not Started";
}

function matchesSearch(p) {
  if (!searchTerm) return true;
  const haystack = [p.name, p.purpose, ...(p.aliases || []), ...p.tasks.flatMap(t => [t[0], t[1], t[3]])]
    .join(" ").toLowerCase();
  return haystack.includes(searchTerm);
}

function renderGrid() {
  const grid = document.getElementById("grid");
  let anyVisible = false;

  grid.innerHTML = PROJECTS.map((p, idx) => {
    const c = countBy(p.tasks);
    const total = p.tasks.length;
    const pct = k => total ? (c[k]/total*100) : 0;
    const passesFilter = currentFilter === "all" || p.priority === currentFilter || (currentFilter === "caution" && p.caution);
    const passesSearch = matchesSearch(p);
    const visible = passesFilter && passesSearch;
    if (visible) anyVisible = true;
    const stripeClass = p.caution ? "caution" : p.priority;

    const rows = p.tasks.map((t, tIdx) => `
      <tr>
        <td class="task-name">${t[0]}</td>
        <td class="task-owner">${t[1]}</td>
        <td><span class="status-pill ${t[2]}" onclick="cycleStatus(${idx},${tIdx},event)" title="Click to change status">${statusLabel(t[2])}</span></td>
        <td class="task-notes">${t[3]}</td>
      </tr>`).join("");

    const cautionBanner = p.caution ? `<div class="caution-banner"><b>⚠ Caution:</b> this group shows patterns worth verifying independently before committing time, money, or a signature.</div>` : "";

    return `
    <div class="card${visible?'':' hidden'}" data-idx="${idx}">
      <div class="core-stripe ${stripeClass}"></div>
      <div class="card-head" onclick="toggleCard(${idx})">
        <div class="card-title-block">
          <div class="card-title">
            ${p.name}
            <span class="badge ${p.priority}">${p.priority}</span>
            ${p.caution ? '<span class="caution-flag">⚠ review</span>' : ''}
          </div>
          <div class="card-purpose">${p.purpose}</div>
        </div>
        <div class="card-right">
          <div class="progress-block">
            <div class="progress-num"><b>${c.done}</b>/${total} done</div>
            <div class="progress-bar">
              <div class="seg done" style="width:${pct('done')}%"></div>
              <div class="seg progress" style="width:${pct('progress')}%"></div>
              <div class="seg notstarted" style="width:${pct('notstarted')}%"></div>
            </div>
          </div>
          ${p.whatsappLink
            ? `<a class="wa-link" href="${p.whatsappLink}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">🔗 Open in WhatsApp</a>`
            : `<span class="wa-link disabled" title="No invite link added yet">🔗 No link yet</span>`}
          <div class="chevron">▶</div>
        </div>
      </div>
      <div class="task-panel">
        <div class="task-panel-inner">
          ${cautionBanner}
          <table>
            <thead><tr><th>Task</th><th>Owner</th><th>Status</th><th>Notes</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
          <div class="notes-section">
            <div class="notes-header">💬 Reviewer Notes</div>
            <div class="notes-list" id="notes-list-${idx}">${renderNotesHTML(p.notes)}</div>
          </div>
        </div>
      </div>
    </div>`;
  }).join("") + (anyVisible ? "" : `<div class="no-results">No groups match "${searchTerm}" with the current filter.</div>`);
}

function toggleCard(idx) {
  const card = document.querySelector(`.card[data-idx="${idx}"]`);
  card.classList.toggle("open");
}

function renderNotesHTML(notes) {
  if (!notes || notes.length === 0) {
    return `<div class="no-notes">No reviewer notes yet.</div>`;
  }
  return notes.map(n => `
    <div class="note-item">
      <div class="note-avatar">${n.author.trim().charAt(0).toUpperCase()}</div>
      <div class="note-body">
        <div class="note-meta"><b>${n.author}</b> · ${n.date}</div>
        <div class="note-text">${n.text}</div>
      </div>
    </div>`).join("");
}

function exportPDF() {
  document.querySelectorAll(".card").forEach(c => c.classList.add("open"));
  const stamp = document.getElementById("print-meta");
  if (stamp) {
    const now = new Date();
    stamp.textContent = "Report generated " + now.toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" }) + " · v1.1";
  }
  setTimeout(() => window.print(), 60);
}

function csvCell(v) {
  const s = String(v == null ? "" : v);
  if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}

function exportCSV() {
  const rows = [["Group", "Priority", "Task", "Owner", "Status", "Task Notes"]];
  PROJECTS.forEach(p => {
    p.tasks.forEach(t => {
      rows.push([p.name, p.priority, t[0], t[1], statusLabel(t[2]), t[3]]);
    });
  });
  rows.push([]);
  rows.push(["Group", "Reviewer", "Date", "Reviewer Note"]);
  PROJECTS.forEach(p => {
    (p.notes || []).forEach(n => {
      rows.push([p.name, n.author, n.date, n.text]);
    });
  });
  const csv = rows.map(r => r.map(csvCell).join(",")).join("\r\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "Serenity_Drug_Kits_Tracker_" + new Date().toISOString().slice(0,10) + ".csv";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function escXml(s) {
  return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

const STATUS_COLOR = { done: "#0F9D58", progress: "#B8860B", notstarted: "#C0392B" };

function chapterXhtml(p) {
  let cautionHtml = "";
  if (p.caution) {
    cautionHtml = `<div class="caution">&#9888; <strong>Caution:</strong> this group shows patterns worth verifying independently before committing time, money, or a signature.</div>`;
  }
  const rows = p.tasks.map(t => {
    const [task, owner, status, note] = t;
    const color = STATUS_COLOR[status] || "#333";
    return `<tr><td>${escXml(task)}</td><td>${escXml(owner)}</td><td><span style="color:${color};font-weight:bold;">${escXml(statusLabel(status))}</span></td><td class="notes">${escXml(note)}</td></tr>`;
  }).join("\n");
  let notesHtml;
  if (p.notes && p.notes.length) {
    const items = p.notes.map(n => `<li><strong>${escXml(n.author)}</strong> (${escXml(n.date)}): ${escXml(n.text)}</li>`).join("\n");
    notesHtml = `<h3>Reviewer Notes</h3><ul class="reviewer-notes">${items}</ul>`;
  } else {
    notesHtml = `<h3>Reviewer Notes</h3><p class="no-notes"><em>No reviewer notes yet.</em></p>`;
  }
  return `<?xml version="1.0" encoding="utf-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head><title>${escXml(p.name)}</title><link rel="stylesheet" type="text/css" href="style.css"/></head>
<body>
<h1>${escXml(p.name)}</h1>
<p class="purpose">${escXml(p.purpose)}</p>
<p class="badge">Priority: <strong>${escXml(p.priority)}</strong></p>
${cautionHtml}
<table>
<thead><tr><th>Task</th><th>Owner</th><th>Status</th><th>Notes</th></tr></thead>
<tbody>
${rows}
</tbody>
</table>
${notesHtml}
</body>
</html>`;
}

`);

  const now = new Date().toISOString();
  oebps.file("titlepage.xhtml", `<?xml version="1.0" encoding="utf-8"?>
<!DOCTYPE html>

<head><title>Serenity Drug Kits Tracker</title><link rel="stylesheet" type="text/css" href="style.css"/></head>

  let spine = "";

    spine += `<itemref idref="${id}"/>\n`;
    navItems += `<li><a href="${c[0]}">${escXml(c[1])}</a></li>\n`;
  });

  const bookUuid = "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, ch => {
    const r = Math.random() * 16 | 0, v = ch === "x" ? r : (r & 0x3 | 0x8);
    return v.toString(16);
  });

  oebps.file("content.opf", `<?xml version="1.0" encoding="utf-8"?>

${manifest}  </manifest>

${spine}  </spine>

}
